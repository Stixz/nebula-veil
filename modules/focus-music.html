<div class="module focus-music">
  <div class="module-header">
    <h2>🎧 Focus Music</h2>
    <div class="now-playing" id="now-playing">Select a sound to begin</div>
  </div>

  <div class="sound-grid" id="sound-grid">
    <div class="sound-card" data-sound="rain">
      <div class="sound-icon">🌧️</div>
      <div class="sound-name">Rain</div>
    </div>
    <div class="sound-card" data-sound="cafe">
      <div class="sound-icon">☕</div>
      <div class="sound-name">Cafe</div>
    </div>
    <div class="sound-card" data-sound="forest">
      <div class="sound-icon">🌲</div>
      <div class="sound-name">Forest</div>
    </div>
    <div class="sound-card" data-sound="ocean">
      <div class="sound-icon">🌊</div>
      <div class="sound-name">Ocean</div>
    </div>
    <div class="sound-card" data-sound="fire">
      <div class="sound-icon">🔥</div>
      <div class="sound-name">Fireplace</div>
    </div>
    <div class="sound-card" data-sound="wind">
      <div class="sound-icon">🍃</div>
      <div class="sound-name">Wind</div>
    </div>
    <div class="sound-card" data-sound="thunder">
      <div class="sound-icon">⛈️</div>
      <div class="sound-name">Thunder</div>
    </div>
    <div class="sound-card" data-sound="night">
      <div class="sound-icon">🌙</div>
      <div class="sound-name">Night</div>
    </div>
  </div>

  <div class="player-controls">
    <button id="stop-btn" class="player-btn">⏹ Stop All</button>
    <div class="volume-control">
      <span>🔈</span>
      <input type="range" id="volume-slider" min="0" max="100" value="50">
      <span>🔊</span>
    </div>
  </div>

  <div class="mixer-section">
    <h3>Sound Mixer</h3>
    <div class="mixer-info">Mix multiple sounds together</div>
    <div id="active-mixer" class="active-mixer"></div>
  </div>
</div>
<script src="focus-music.js"></script>
