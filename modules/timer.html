<div class="module timer">
  <div class="module-header">
    <h2>⏳ Focus Timer</h2>
  </div>
  
  <div class="timer-display">
    <div id="timer-countdown" class="countdown">25:00</div>
    <div id="timer-status" class="status">Focus Time</div>
  </div>

  <div class="timer-controls">
    <button id="start-btn" class="timer-btn">Start</button>
    <button id="pause-btn" class="timer-btn">Pause</button>
    <button id="reset-btn" class="timer-btn">Reset</button>
  </div>

  <div class="timer-modes">
    <button data-min="25" class="mode-btn active">Pomodoro</button>
    <button data-min="5" class="mode-btn">Short Break</button>
    <button data-min="15" class="mode-btn">Long Break</button>
  </div>
    <script src="timer.js"></script>
</div>
</div>
